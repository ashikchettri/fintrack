name: Deploy to GKE

# Tag a release (e.g. v0.1.0) to build, scan, push and deploy. Keyless: GitHub
# authenticates to Google via Workload Identity Federation (ADR 017) — no keys.
# Requires repository variables (from `terraform output`): GCP_PROJECT, GCP_REGION,
# WIF_PROVIDER, DEPLOYER_SA, GKE_CLUSTER, CLOUDSQL_CONNECTION, APP_GSA,
# INGRESS_HOST, INGRESS_IP_NAME. And k8s secrets fintrack-secrets + auth-jwt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write          # mint the OIDC token for WIF

env:
  IMAGE_PREFIX: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/fintrack

jobs:
  images:
    name: build+push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, finance-service, gateway-service, insight-service, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          load: true          # load locally so we scan before pushing
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan (Trivy) — fail closed on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.ref_name }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: table

      - name: Push
        run: docker push ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.ref_name }}

  deploy:
    name: helm upgrade
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GCP_REGION }}

      - uses: azure/setup-helm@v4

      - name: Helm upgrade
        run: |
          helm upgrade --install fintrack infra/helm/fintrack \
            --namespace fintrack --create-namespace \
            -f infra/helm/fintrack/values-gke.yaml \
            --set image.registry=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }} \
            --set image.tag=${{ github.ref_name }} \
            --set cloudSqlProxy.connectionName=${{ vars.CLOUDSQL_CONNECTION }} \
            --set ingress.host=${{ vars.INGRESS_HOST }} \
            --set ingress.staticIpName=${{ vars.INGRESS_IP_NAME }} \
            --set-string serviceAccount.annotations."iam\.gke\.io/gcp-service-account"=${{ vars.APP_GSA }} \
            --wait --timeout 10m
