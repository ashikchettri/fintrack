{{- if .Values.ingress.enabled }}
{{- /* Merge base annotations with the GKE-only ones (managed cert, static IP,
       HTTPS redirect) so nginx/Minikube stays clean and GCE gets what it needs. */}}
{{- $ann := deepCopy (.Values.ingress.annotations | default dict) }}
{{- /* GKE's GCE controller keys off this annotation, not ingressClassName. */}}
{{- if eq .Values.ingress.className "gce" }}
{{- $_ := set $ann "kubernetes.io/ingress.class" "gce" }}
{{- end }}
{{- if .Values.ingress.managedCertificate.enabled }}
{{- $_ := set $ann "networking.gke.io/managed-certificates" (printf "%s-cert" .Release.Name) }}
{{- end }}
{{- if .Values.ingress.staticIpName }}
{{- $_ := set $ann "kubernetes.io/ingress.global-static-ip-name" .Values.ingress.staticIpName }}
{{- end }}
{{- if .Values.ingress.httpsRedirect }}
{{- $_ := set $ann "networking.gke.io/v1beta1.FrontendConfig" (printf "%s-frontend" .Release.Name) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "fintrack.labels" . | nindent 4 }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.frontend.enabled }}
          # /api → the gateway (single API entry, ADR 007); everything else → the SPA.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: {{ (index .Values.services "gateway-service").port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.port }}
          {{- else }}
          # No SPA deployed — everything to the gateway (API only).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: {{ (index .Values.services "gateway-service").port }}
          {{- end }}
{{- end }}
