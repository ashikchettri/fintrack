{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fintrack.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "fintrack.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "fintrack.labels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      {{- if $svc.waitForPostgres }}
      initContainers:
        {{- if $.Values.cloudSqlProxy.enabled }}
        # Native-sidecar Cloud SQL Auth Proxy: starts before the app and stays
        # running, exposing Cloud SQL on 127.0.0.1:5432 (DB_HOST override below).
        - name: cloud-sql-proxy
          restartPolicy: Always
          image: {{ $.Values.cloudSqlProxy.image }}
          args:
            - "--structured-logs"
            - "--port=5432"
            - {{ required "cloudSqlProxy.connectionName is required when cloudSqlProxy.enabled" $.Values.cloudSqlProxy.connectionName | quote }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
        {{- else }}
        - name: wait-for-postgres
          image: {{ $.Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U {{ $.Values.config.postgresUser }}; do echo 'waiting for postgres'; sleep 2; done"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "fintrack.image" (dict "name" $name "root" $) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}-config
          env:
            {{- if $svc.waitForPostgres }}
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "fintrack.secretName" $ }}, key: POSTGRES_PASSWORD } }
            {{- if $.Values.cloudSqlProxy.enabled }}
            - name: DB_HOST            # reach Cloud SQL via the in-pod proxy, not the postgres Service
              value: "127.0.0.1"
            {{- end }}
            {{- end }}
            {{- if $svc.anthropic }}
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "fintrack.secretName" $ }}, key: ANTHROPIC_API_KEY } }
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $svc.jwtKey }}
            - name: jwt-key
              mountPath: /etc/fintrack
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          resources:
            {{- toYaml ($svc.resources | default $.Values.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $svc.jwtKey }}
        - name: jwt-key
          secret:
            secretName: {{ $.Values.auth.jwtKeySecret }}
        {{- end }}
{{- end }}
