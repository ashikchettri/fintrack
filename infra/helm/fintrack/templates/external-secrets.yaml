{{- if .Values.externalSecrets.enabled }}
# GCP Secret Manager store, authenticated by the app KSA's Workload Identity
# (bound to a GSA with secretmanager.secretAccessor). Requires ESO in-cluster.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secretmanager
  labels:
    {{- include "fintrack.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ required "externalSecrets.projectID is required" .Values.externalSecrets.projectID | quote }}
      auth:
        workloadIdentity:
          clusterLocation: {{ required "externalSecrets.clusterLocation is required" .Values.externalSecrets.clusterLocation | quote }}
          clusterName: {{ required "externalSecrets.clusterName is required" .Values.externalSecrets.clusterName | quote }}
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name }}
---
# App secrets (DB password + Anthropic key) → the Secret the services read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "fintrack.secretName" . }}
  labels:
    {{- include "fintrack.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: gcp-secretmanager
    kind: SecretStore
  target:
    name: {{ include "fintrack.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.dbPasswordSecret }}
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.anthropicSecret }}
---
# JWT signing key (PKCS#8 PEM) → the Secret auth mounts at /etc/fintrack.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.auth.jwtKeySecret }}
  labels:
    {{- include "fintrack.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: gcp-secretmanager
    kind: SecretStore
  target:
    name: {{ .Values.auth.jwtKeySecret }}
    creationPolicy: Owner
  data:
    - secretKey: jwt-signing.pem
      remoteRef:
        key: {{ .Values.externalSecrets.jwtSecret }}
{{- end }}
